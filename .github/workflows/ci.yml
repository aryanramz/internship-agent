name: Python tests and repository privacy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audited application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,google,mcp,security]'
      - name: Audit installed dependency advisories
        run: |
          python -m pip list --format=freeze --exclude internship-agent > "$RUNNER_TEMP/audited-requirements.txt"
          python -m pip_audit --strict --disable-pip --no-deps --progress-spinner off -r "$RUNNER_TEMP/audited-requirements.txt"
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,google,mcp]'
      - name: Tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src
      - name: Check for private artifacts
        run: python scripts/check_repo_hygiene.py
      - name: Demonstrate synthetic offline workflow
        run: python scripts/demo.py
