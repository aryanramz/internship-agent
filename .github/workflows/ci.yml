name: Python tests and repository privacy

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audited application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,google,mcp,security]'
      - name: Audit installed dependency advisories
        run: |
          python -m pip list --format=freeze --exclude internship-agent > "$RUNNER_TEMP/audited-requirements.txt"
          python -m pip_audit --strict --disable-pip --no-deps --progress-spinner off -r "$RUNNER_TEMP/audited-requirements.txt"
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,google,mcp]'
      - name: Tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q src
      - name: Check for private artifacts
        run: python scripts/check_repo_hygiene.py
      - name: Demonstrate synthetic offline workflow
        run: python scripts/demo.py
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '0'
      RUN_LIVE_ATS: '0'
      RUN_LIVE_SHEETS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Report native Windows encoding
        run: |
          python -c "import locale, platform, sys; print(platform.platform()); print(sys.version); print('locale.getencoding():', locale.getencoding()); print('locale.getpreferredencoding(False):', locale.getpreferredencoding(False)); print('UTF-8 mode:', sys.flags.utf8_mode); assert sys.platform == 'win32'; assert sys.flags.utf8_mode == 0"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install package and declared optional dependencies
        run: python -m pip install -e '.[test,google,mcp,security]'
      - name: Check dependency consistency
        run: python -m pip check
      - name: Document variants and Unicode trace regression
        run: python -m pytest tests/test_document_variants.py -v -ra
      - name: Diagnose synthetic Windows renderer transport
        run: |
          @'
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $request = '{"workspace":"C:\\Synthetic \u03a9 Workspace\\agent","config_path":"C:\\Private\\gateway.json","keycloak_home":"C:\\Providers\\keycloak","user_sid":"S-1-5-21-1000","windows_dir":"C:\\Windows"}' | ConvertFrom-Json
          $json = $request | ConvertTo-Json -Depth 12 -Compress
          $json | python -X utf8 -c 'import sys; print(sys.flags.utf8_mode); print(sys.stdin.encoding,sys.stdout.encoding); print(sys.stdin.buffer.read().hex())'
          $json | python -X utf8 scripts/windows/task_config.py render
          exit $LASTEXITCODE
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP/renderer-probe.ps1" -Encoding utf8
          powershell.exe -NoLogo -NoProfile -NonInteractive -File "$env:RUNNER_TEMP/renderer-probe.ps1"
      - name: Full offline suite
        run: python -m pytest -q -ra
      - name: Compile
        run: python -m compileall -q src
      - name: Check for private artifacts
        run: python scripts/check_repo_hygiene.py
      - name: Demonstrate synthetic offline workflow
        run: python scripts/demo.py
