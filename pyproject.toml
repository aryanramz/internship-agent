[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-agent"
version = "0.4.0"
description = "Local-first, MCP-enabled internship discovery and application tracking"
requires-python = ">=3.11"
dependencies = ["python-docx>=1.2,<2"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
google = ["google-api-python-client>=2.120,<3", "google-auth-oauthlib>=1.2,<2"]
test = ["pytest>=8"]

[project.scripts]
internship-agent = "internship_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["internship_agent"]
branch = true

[tool.coverage.report]
omit = ["*/mcp_server.py"]
show_missing = true
